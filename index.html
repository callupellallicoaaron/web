<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Galaxia de flores amarillas A12🌻</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none; /* Previene scroll no deseado en celulares */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            overflow: hidden;
            background-color: #030108;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* El contenedor de texto se asegura de estar sobre el canvas 3D */
        #text-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        /* Pantalla Inicial con el Girasol Principal */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, rgba(20,10,35,0.95) 0%, rgba(3,1,8,1) 100%);
            transition: opacity 1.2s ease, visibility 1.2s;
            cursor: pointer;
        }

        .flower-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffe600 0%, #ff8c00 70%, #5c3a21 100%);
            box-shadow: 0 0 40px #ffd700, 0 0 80px rgba(255, 215, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 80px;
            animation: pulse 2s infinite alternate;
            cursor: pointer;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 30px #ffd700; }
            100% { transform: scale(1.1); box-shadow: 0 0 70px #ffd700, 0 0 100px #ffaa00; }
        }

        .tap-instruction {
            margin-top: 25px;
            font-size: 1.3rem;
            color: #ffe680;
            text-shadow: 0 0 10px #ffd700;
            letter-spacing: 1px;
            animation: fadeIn 1.5s infinite alternate;
            padding: 0 15px;
            text-align: center;
        }

        /* Cartel con la Frase Principal */
        #main-title-card {
            position: absolute;
            top: 3%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2s ease;
            width: 90%;
            max-width: 500px;
        }

        h1 {
            color: #ffd700;
            font-size: 2rem;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.9), 0 0 30px rgba(255, 180, 0, 0.7);
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #fff8d0;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
        }

        /* Estilos de las frases 3D que flotan en el espacio */
        .galaxy-text {
            position: absolute;
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            text-shadow: 0 0 8px #ffd700, 0 0 18px #ff8c00, 0 0 4px #000;
            pointer-events: none;
            white-space: nowrap;
            transition: opacity 0.3s ease;
            transform: translate(-50%, -50%);
            /* Fondo suave y desenfoque para legibilidad cuando hay girasoles detras */
            background: rgba(3, 1, 8, 0.55);
            padding: 6px 14px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
        }

        /* Ajustes específicos para móviles */
        @media (max-width: 600px) {
            h1 {
                font-size: 1.4rem;
            }

            p.subtitle {
                font-size: 0.8rem;
            }

            .flower-btn {
                width: 120px;
                height: 120px;
                font-size: 60px;
            }

            .tap-instruction {
                font-size: 1.05rem;
            }

            .galaxy-text {
                font-size: 16px;
                padding: 5px 10px;
            }
        }

        /* Ocultar pantalla inicial */
        .hidden {
            opacity: 0 !important;
            visibility: hidden !important;
        }
    </style>

    <!-- Librerías de Three.js y OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body oncontextmenu="return false;">

    <!-- Pantalla Inicial -->
    <div id="start-screen">
        <div class="flower-btn">🌻</div>
        <div class="tap-instruction">Aure toca el girasol para ver tu galaxia✨</div>
    </div>

    <!-- Título Principal Superior -->
    <div id="main-title-card">
        <h1>Feliz Día de las Flores Amarillas</h1>
        <p class="subtitle">Para que te muevas y veas las frases usa tu dedo, no es especial jeje✨🌻</p>
    </div>

    <!-- Contenedor 3D -->
    <div id="canvas-container"></div>
    <div id="text-container"></div>

    <script>
        // Prevenir selección por arrastre de cursor/dedo
        document.addEventListener('selectstart', e => e.preventDefault());

        const phrases = [
            "Busca a Evangeline🌻",
            "Nadie te frena cuando te propones algo✨",
            "Eres mi recuerdo favorito para invocar un Patronus💛",
            "Tienes un corazon maravilloso en un mundo lleno de muggles",
            "Mi bella Evangeline... tan lejos y tan cerca a la vez🌟",
            "Gracias por existir",
            "Ni con un OBLIVIATE se me olvidaría lo buena amiga que eres💛",
            "Ni el Felix Felicis supera la suerte de haberte conocido🧪",
            "Tienes la fuerza de una guerrera y un corazón gigante 🌻",
            "Eres como una flor que florece en la adversidad🌻",
            "Admiro un montón lo fuerte y decidida que eres 🏹",
            "Para la persona más especial ✨",
            "Tu amistad vale mas que cualquier tesoro",
            "Nunca dejes de sonreir, que eres hermosa 💛"
        ];

        let scene, camera, renderer, controls;
        let galaxyGroup, pointsMesh;
        let textElements = [];
        let isGalaxyActive = false;

        const container = document.getElementById('canvas-container');
        const textContainer = document.getElementById('text-container');
        const startScreen = document.getElementById('start-screen');
        const mainTitleCard = document.getElementById('main-title-card');

        function initScene() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 18, 30);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.rotateSpeed = 0.8;
            controls.zoomSpeed = 0.8;
            controls.maxDistance = 60;
            controls.minDistance = 10;

            galaxyGroup = new THREE.Group();
            scene.add(galaxyGroup);

            const coreGeo = new THREE.SphereGeometry(1.5, 32, 32);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0xffea00 });
            const core = new THREE.Mesh(coreGeo, coreMat);
            galaxyGroup.add(core);

            const flowerTexture = createFlowerTexture();

            const particleCount = 3500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            const arms = 5;
            const radius = 25;

            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                const r = Math.pow(Math.random(), 2) * radius;
                const armIndex = i % arms;
                const spinAngle = r * 0.9;
                const branchAngle = ((armIndex * 2 * Math.PI) / arms) + spinAngle;

                const randomX = (Math.random() - 0.5) * (r * 0.25);
                const randomY = (Math.random() - 0.5) * (r * 0.2);
                const randomZ = (Math.random() - 0.5) * (r * 0.25);

                positions[i3] = Math.cos(branchAngle) * r + randomX;
                positions[i3 + 1] = randomY;
                positions[i3 + 2] = Math.sin(branchAngle) * r + randomZ;

                const col = new THREE.Color();
                if (Math.random() > 0.2) {
                    col.setHSL(0.13 + Math.random() * 0.04, 1.0, 0.5 + Math.random() * 0.3);
                } else {
                    col.setHSL(0.1, 0.9, 0.85);
                }

                colors[i3] = col.r;
                colors[i3 + 1] = col.g;
                colors[i3 + 2] = col.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.9,
                map: flowerTexture,
                transparent: true,
                vertexColors: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            pointsMesh = new THREE.Points(geometry, material);
            galaxyGroup.add(pointsMesh);

            createFloatingPhrases();

            galaxyGroup.rotation.x = 0.4;
        }

        function createFlowerTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffd700';
            for (let i = 0; i < 10; i++) {
                const angle = (i * Math.PI * 2) / 10;
                ctx.save();
                ctx.translate(32, 32);
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.ellipse(0, 12, 4, 11, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            ctx.beginPath();
            ctx.arc(32, 32, 7, 0, Math.PI * 2);
            ctx.fillStyle = '#4a2810';
            ctx.fill();

            return new THREE.CanvasTexture(canvas);
        }

        function createFloatingPhrases() {
            const count = phrases.length;
            const radius = 18;

            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                const r = 8 + Math.random() * radius;
                const x = Math.cos(angle) * r;
                const y = (Math.random() - 0.5) * 6;
                const z = Math.sin(angle) * r;

                const el = document.createElement('div');
                el.className = 'galaxy-text';
                el.innerText = phrases[i];
                textContainer.appendChild(el);

                const pos = new THREE.Vector3(x, y, z);
                textElements.push({ element: el, pos: pos });
            }
        }

        function updateTextPositions() {
            if (!isGalaxyActive) return;

            textElements.forEach(item => {
                const worldPos = item.pos.clone().applyMatrix4(galaxyGroup.matrixWorld);
                const screenPos = worldPos.clone().project(camera);

                // Comprobar si está al frente de la cámara
                if (screenPos.z < 1) {
                    const x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
                    const y = (-(screenPos.y * 0.5) + 0.5) * window.innerHeight;

                    // Ajuste de escala dinámico según la cercanía a la cámara
                    const distance = camera.position.distanceTo(worldPos);
                    const scale = Math.max(0.6, Math.min(1.4, 25 / distance));

                    item.element.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px) scale(${scale})`;
                    item.element.style.opacity = '1';
                } else {
                    item.element.style.opacity = '0';
                }
            });
        }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            if (isGalaxyActive) {
                galaxyGroup.rotation.y = elapsedTime * 0.08;
                controls.update();
                updateTextPositions();
            }

            renderer.render(scene, camera);
        }

        startScreen.addEventListener('click', () => {
            startScreen.classList.add('hidden');
            mainTitleCard.style.opacity = '1';
            isGalaxyActive = true;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        initScene();
        animate();
    </script>
</body>
</html>
