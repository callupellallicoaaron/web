<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galaxia de flores amarillas A12🌻</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none; /* Previene scroll o zoom nativo no deseado en celulares */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none; /* Deshabilita la selección de texto en PC y Móvil */
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow: hidden;
            background-color: #030108;
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
            color: #fff;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Capa exclusiva de textos flotantes por encima del Canvas 3D */
        #text-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            overflow: hidden;
        }

        /* Pantalla Inicial con el Girasol Principal */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 30;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, rgba(20,10,35,0.96) 0%, rgba(3,1,8,1) 100%);
            transition: opacity 1.2s ease, visibility 1.2s;
            cursor: pointer;
            padding: 20px;
            text-align: center;
        }

        .flower-btn {
            width: clamp(110px, 25vw, 160px);
            height: clamp(110px, 25vw, 160px);
            border-radius: 50%;
            background: radial-gradient(circle, #ffe600 0%, #ff8c00 70%, #5c3a21 100%);
            box-shadow: 0 0 35px #ffd700, 0 0 70px rgba(255, 215, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(50px, 12vw, 80px);
            animation: pulse 2s infinite alternate;
            cursor: pointer;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 25px #ffd700; }
            100% { transform: scale(1.08); box-shadow: 0 0 60px #ffd700, 0 0 90px #ffaa00; }
        }

        .tap-instruction {
            margin-top: 20px;
            font-size: clamp(1rem, 4vw, 1.3rem);
            color: #ffe680;
            text-shadow: 0 0 10px #ffd700;
            letter-spacing: 0.5px;
            animation: fadeIn 1.5s infinite alternate;
            padding: 0 10px;
        }

        /* Cartel con la Frase Principal */
        #main-title-card {
            position: absolute;
            top: clamp(2%, 4vh, 5%);
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2s ease;
            width: 92%;
            max-width: 550px;
        }

        h1 {
            color: #ffd700;
            font-size: clamp(1.2rem, 4.5vw, 2.1rem);
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.9), 0 0 25px rgba(255, 180, 0, 0.7);
            margin-bottom: 4px;
            line-height: 1.2;
        }

        p.subtitle {
            font-size: clamp(0.75rem, 2.8vw, 0.95rem);
            color: #fff8d0;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
            line-height: 1.3;
        }

        .galaxy-text {
            position: absolute;
            color: #ffffff;
            font-size: clamp(12px, 3.2vw, 16px);
            font-weight: 700;
            text-shadow: 0 0 8px #ffd700, 0 0 16px #ff8c00, 0 0 3px #000;
            pointer-events: none;
            white-space: nowrap;
            transition: opacity 0.3s ease;
            transform: translate(-50%, -50%);
            
            /* Cápsula de lectura para evitar solapamiento con los girasoles */
            background: rgba(10, 4, 22, 0.75);
            padding: clamp(4px, 1.2vw, 7px) clamp(8px, 2.5vw, 14px);
            border-radius: 20px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.8), 0 0 6px rgba(255, 215, 0, 0.2);
            max-width: 88vw;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hidden {
            opacity: 0 !important;
            visibility: hidden !important;
        }
    </style>

    <!-- Libres de Three.js y OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body oncontextmenu="return false;">

    <!-- Pantalla Inicial -->
    <div id="start-screen">
        <div class="flower-btn">🌻</div>
        <div class="tap-instruction">Aure toca el girasol para ver tu galaxia✨</div>
    </div>

    <!-- Título Principal Superior -->
    <div id="main-title-card">
        <h1>Feliz Día de las Flores Amarillas</h1>
        <p class="subtitle">Para que te muevas y veas las frases usa tu dedo, no ses especial jeje✨🌻</p>
    </div>

    <!-- Contenedores 3D y de Texto -->
    <div id="canvas-container"></div>
    <div id="text-container"></div>

    <script>
        // Prevenir selección de texto táctil y por mouse
        document.addEventListener('selectstart', (e) => e.preventDefault());
        document.addEventListener('dragstart', (e) => e.preventDefault());

        const phrases = [
            "Busca a Evangeline🌻",
            "Nadie te frena cuando te propones algo✨",
            "Eres mi recuerdo favorito para invocar un Patronus💛",
            "Tienes un corazon maravilloso en un mundo lleno de muggles",
            "Mi bella Evangeline... tan lejos y tan cerca a la vez🌟",
            "Gracias por existir",
            "Ni con un OBLIVIATE se me olvidaría lo buena amiga que eres💛",
            "Ni el Felix Felicis supera la suerte de haberte conocido🧪",
            "Tienes la fuerza de una guerrera y un corazón gigante 🌻",
            "Eres como una flor que florece en la adversidad🌻",
            "Admiro un montón lo fuerte y decidida que eres 🏹",
            "Para la persona más especial ✨",
            "Tu amistad vale mas que cualquier tesoro",
            "Nunca dejes de sonreir, que eres hermosa 💛"
        ];

        let scene, camera, renderer, controls;
        let galaxyGroup, pointsMesh;
        let textElements = [];
        let isGalaxyActive = false;

        const container = document.getElementById('canvas-container');
        const textContainer = document.getElementById('text-container');
        const startScreen = document.getElementById('start-screen');
        const mainTitleCard = document.getElementById('main-title-card');

        function initScene() {
            scene = new THREE.Scene();

            // Ajustar el FOV para vista óptima en pantallas verticales de móviles
            const aspect = window.innerWidth / window.innerHeight;
            const fov = aspect < 1 ? 70 : 60;
            camera = new THREE.PerspectiveCamera(fov, aspect, 0.1, 1000);
            
            // Posicionar la cámara un poco más lejos en teléfonos para ver la galaxia completa
            const initialZ = aspect < 1 ? 36 : 30;
            camera.position.set(0, 18, initialZ);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.rotateSpeed = aspect < 1 ? 0.6 : 0.8; // Rotación más suave en pantallas táctiles
            controls.zoomSpeed = 0.8;
            controls.maxDistance = 65;
            controls.minDistance = 8;

            galaxyGroup = new THREE.Group();
            scene.add(galaxyGroup);

            // Núcleo Dorado
            const coreGeo = new THREE.SphereGeometry(1.5, 32, 32);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0xffea00 });
            const core = new THREE.Mesh(coreGeo, coreMat);
            galaxyGroup.add(core);

            // Partículas de Flores y Estrellas
            const flowerTexture = createFlowerTexture();
            const particleCount = window.innerWidth < 600 ? 2800 : 3500; // Optimización de rendimiento
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            const arms = 5;
            const radius = 25;

            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                const r = Math.pow(Math.random(), 2) * radius;
                const armIndex = i % arms;
                const spinAngle = r * 0.9;
                const branchAngle = ((armIndex * 2 * Math.PI) / arms) + spinAngle;

                const randomX = (Math.random() - 0.5) * (r * 0.25);
                const randomY = (Math.random() - 0.5) * (r * 0.2);
                const randomZ = (Math.random() - 0.5) * (r * 0.25);

                positions[i3] = Math.cos(branchAngle) * r + randomX;
                positions[i3 + 1] = randomY;
                positions[i3 + 2] = Math.sin(branchAngle) * r + randomZ;

                const col = new THREE.Color();
                if (Math.random() > 0.2) {
                    col.setHSL(0.13 + Math.random() * 0.04, 1.0, 0.5 + Math.random() * 0.3);
                } else {
                    col.setHSL(0.1, 0.9, 0.85);
                }

                colors[i3] = col.r;
                colors[i3 + 1] = col.g;
                colors[i3 + 2] = col.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: window.innerWidth < 600 ? 1.1 : 0.9,
                map: flowerTexture,
                transparent: true,
                vertexColors: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            pointsMesh = new THREE.Points(geometry, material);
            galaxyGroup.add(pointsMesh);

            createFloatingPhrases();
            galaxyGroup.rotation.x = 0.4;
        }

        function createFlowerTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffd700';
            for (let i = 0; i < 10; i++) {
                const angle = (i * Math.PI * 2) / 10;
                ctx.save();
                ctx.translate(32, 32);
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.ellipse(0, 12, 4, 11, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            ctx.beginPath();
            ctx.arc(32, 32, 7, 0, Math.PI * 2);
            ctx.fillStyle = '#4a2810';
            ctx.fill();

            return new THREE.CanvasTexture(canvas);
        }

        function createFloatingPhrases() {
            const count = phrases.length;
            const radius = 18;

            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                const r = 8 + Math.random() * radius;
                const x = Math.cos(angle) * r;
                const y = (Math.random() - 0.5) * 6;
                const z = Math.sin(angle) * r;

                const el = document.createElement('div');
                el.className = 'galaxy-text';
                el.innerText = phrases[i];
                textContainer.appendChild(el);

                const pos = new THREE.Vector3(x, y, z);
                textElements.push({ element: el, pos: pos });
            }
        }

        function updateTextPositions() {
            if (!isGalaxyActive) return;

            const isMobile = window.innerWidth <= 600;

            textElements.forEach(item => {
                const worldPos = item.pos.clone().applyMatrix4(galaxyGroup.matrixWorld);
                const screenPos = worldPos.clone().project(camera);

                if (screenPos.z < 1) {
                    const x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
                    const y = (-(screenPos.y * 0.5) + 0.5) * window.innerHeight;

                    // Cálculo de escala adaptativo según distancia y pantalla
                    const distToCamera = camera.position.distanceTo(worldPos);
                    let scale = 28 / distToCamera;
                    
                    // Rango de escala optimizado para celulares
                    const minScale = isMobile ? 0.75 : 0.65;
                    const maxScale = isMobile ? 1.35 : 1.5;
                    scale = Math.max(minScale, Math.min(scale, maxScale));

                    item.element.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px) scale(${scale.toFixed(2)})`;
                    item.element.style.opacity = '1';
                } else {
                    item.element.style.opacity = '0';
                }
            });
        }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            if (isGalaxyActive) {
                galaxyGroup.rotation.y = elapsedTime * 0.08;
                controls.update();
                updateTextPositions();
            }

            renderer.render(scene, camera);
        }

        startScreen.addEventListener('click', () => {
            startScreen.classList.add('hidden');
            mainTitleCard.style.opacity = '1';
            isGalaxyActive = true;
        });

        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.aspect = aspect;
            camera.fov = aspect < 1 ? 70 : 60;
            camera.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            if (pointsMesh && pointsMesh.material) {
                pointsMesh.material.size = window.innerWidth < 600 ? 1.1 : 0.9;
            }
        });

        // Inicializar escena y bucle
        initScene();
        animate();
    </script>
</body>
</html>
